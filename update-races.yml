name: Update race data

# Keeps the demo's "可參加賽事" list fresh: downloads the two source pages into the repo root every 6 hours.
# The page itself parses these files in the browser (same code as the Tomcat version).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download race pages
        run: |
          # fetch URL OUTPUT MARKER: keep the old file unless the download succeeded and looks like the real page
          fetch() {
            if curl -fsSL --retry 3 --retry-delay 5 -m 60 -A "Mozilla/5.0 (RUNLOG race updater)" -o "$2.tmp" "$1" && grep -q "$3" "$2.tmp"; then
              mv "$2.tmp" "$2"
            else
              echo "Skipped $1"
              rm -f "$2.tmp"
            fi
          }
          year=$(date +%Y)
          next=$((year + 1))
          fetch "http://www.taipeimarathon.org.tw/contest.aspx" data-contest.html 'id="GridView1"'
          fetch "https://www.sportsnet.org.tw/schedule.php?schedule_year=$year" "data-ctrra-$year.html" 'class="races"'
          fetch "https://www.sportsnet.org.tw/schedule.php?schedule_year=$next" "data-ctrra-$next.html" 'class="races"'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-*.html
          git diff --cached --quiet || (git commit -m "Update race data" && git push)
